packages:
  - runtime/substrate/platform/packages/shared
  - runtime/substrate/platform/packages/ui-shared
  - runtime/substrate/platform/packages/plugin-sdk
  - runtime/node/backend
  - runtime/node/ai-backend
  - delivery/web/ai-frontend
  - delivery/web/provider-hub
  - delivery/channel/khyquant/frontend
  - delivery/extension/tools/khy-markdown

onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild
  - node-pty

overrides:
  khy-ai-backend>@khy/shared: workspace:*
  khy-os-backend>@khy/shared: link:runtime/node/backend/vendor/shared
  khy-os-backend>khy-ai-backend: workspace:*
  # 可选 peerDep：后端以 try/catch 包着 require，缺包走内置回退校验器。
  # 在 workspace checkout 里解析到 live 源码（与 @khy/shared 同机制），
  # 发布 tarball 里 prepack 会拷成 vendor 真实副本，两端都不悬空。
  khy-os-backend>@khy/plugin-sdk: workspace:*

patchedDependencies:
  node-pty@1.0.0: works/patches/node-pty@1.0.0.patch
