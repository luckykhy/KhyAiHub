name: Build Standalone Executables

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to build (leave empty for all)'
        required: false
        default: ''
      platform:
        description: 'Platform (win-x64, linux-x64, macos-x64, macos-arm64, or empty for all)'
        required: false
        default: ''

# 默认只读。release job 单独提权为 contents: write（见文件末尾）。
permissions:
  contents: read

# 4 平台矩阵打包是最贵的流水线。同一 ref 只保留一次运行；
# tag 构建不取消 —— 发布产物不可重放。
concurrency:
  group: build-executables-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-13
            platform: macos-x64
          - os: macos-14
            platform: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # 显式 pin，与根 package.json 的 packageManager 保持一致。
          # 不写则依赖 action 隐式探测；探测结果与 corepack 不一致时会在安装
          # 阶段额外下载第二个 pnpm，报难查的 ERR_PNPM_*。
          version: 10.18.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm run install:core

      - name: Install frontend dependencies
        shell: bash
        run: |
          npm run install:frontend

      # 发布链路上的 lint 暂为报告态。
      # 原因：npm run lint 是 `eslint src/ --max-warnings 0`，而 src/ 现存
      # 3417 个问题（428 errors + 2989 warnings / 2246 个文件中 1060 个命中）。
      # 保持阻断等于让任何 v* tag 都无法出包。
      # 质量把关改由 pr-gate.yml 的棘轮承担（新增文件零容忍），存量债务清零后
      # 删掉这里的 continue-on-error 即恢复阻断。
      - name: Lint (report only)
        continue-on-error: true
        working-directory: runtime/node/backend
        run: npm run lint

      - name: Test portable contracts
        shell: bash
        run: |
          npm test --workspace=khy-os-backend -- --runInBand \
            tests/bridge/bridgeAuth.paths.test.js \
            tests/tasks/diskOutput.paths.test.js \
            tests/utils/dataHome.appHome.test.js \
            tests/utils/sharedPortablePaths.test.js
          node --test \
            scripts/tests/artifactManifest.test.js \
            scripts/tests/portableArtifactBuilder.test.js \
            scripts/tests/portableHealthCheck.artifact.test.js \
            scripts/tests/packPortableArtifact.test.js \
            scripts/tests/portableHostIsolation.test.js \
            scripts/tests/packagePortable.test.js

      - name: Build and package portable artifact
        shell: bash
        run: |
          KIND=dev
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then KIND=runtime; fi
          node delivery/extension/scripts/khy-portable/package-portable.js --kind "$KIND" --keep-artifact

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khy-os-${{ matrix.platform }}
          path: |
            entries/portable/portable-*-${{ matrix.platform }}/
            entries/portable/releases/portable-*-${{ matrix.platform }}.zip
          retention-days: 30

  # Android 签名发布链（dist/android）。
  #
  # 为什么单独一个 job 而不并进上面的 4 平台矩阵：它要 flutter + JDK 17 +
  # Android SDK 三套工具链，比矩阵里任何一项都重得多，混在一起会让整条矩阵等它。
  #
  # 为什么只在 tag 与手动触发时跑：APK 是发布件，不是每次推送都要的构件；
  # main 上的常规推送不出 APK，顺带省掉每次推送几分钟的 flutter 构建。
  # release job 的 needs 里有它，所以 tag 构建一定等它完成。
  #
  # 签名密钥走 secrets，不落 key.properties（那是本机开发路径，gitignored）。
  # 缺 secret 时 build-android.ps1 自动回退 debug 签名，并按脚本 :574-575 的
  # 「命名跟随签名事实」把产物命名为 app-debug.*——release job 的 glob 只匹配
  # app-release.*，所以 debug 包不可能被当成发布件上传，不需要额外闸门。
  #
  # 这个 job 存在的理由：dist/android 被 .gitignore 的 dist/ 与 *.apk / *.aab
  # 三条规则屏蔽，git 追踪不到它，2026-11-20 它被 clean.js --apply 永久毁掉后
  # 只能靠重新构建恢复。上传到 GitHub Release 是它唯一的耐久归档。
  build-android:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ANDROID_SDK_ROOT / ANDROID_HOME 由它设置，build-android.ps1:152-163 认这两个。
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 版本 pin 到本机开发所用的 3.47.2（自带 Dart 3.13.2，与 pubspec 的
      # sdk: ^3.13.2 对齐）。不 pin 会让 CI 追最新 stable，Dart 小版本升级
      # 常带破坏性变更，结果是与本机构建不一致。
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      # 需要的 4 个 repository secrets（Settings → Secrets and variables → Actions）：
      #   KHY_ANDROID_KEYSTORE_BASE64  base64 编码的 khyos-release.keystore
      #                                 （本机生成：certutil -encode keystore tmp.b64
      #                                  或 openssl base64 -in keystore）
      #   KHY_ANDROID_KEY_ALIAS        key.properties 里的 keyAlias，默认 khyos-release
      #   KHY_ANDROID_STORE_PASSWORD   key.properties 里的 storePassword
      #   KHY_ANDROID_KEY_PASSWORD     key.properties 里的 keyPassword
      # build.gradle 的优先级是 KHY_ANDROID_* > key.properties > debug 回退，
      # 所以这里只设环境变量、不落 key.properties 文件。
      - name: Materialize release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KHY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          KS=delivery/channel/mobile/khy-os-client-app/android/khyos-release.keystore
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::KHY_ANDROID_KEYSTORE_BASE64 not set - falling back to debug signing, artifacts will be named app-debug.* and will NOT reach the release"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          echo "keystore bytes: $(wc -c < "$KS")"

      # KHY_ANDROID_STORE_FILE 用相对 android/ 的形式：build.gradle 的
      # rootProject.file() 与 build-android.ps1:191 都会把它解析到 android/ 下，
      # 这样 workflow 里不出现任何 Windows 绝对路径。
      # shell 用 pwsh 而不是 bash：build-android.ps1 是 PowerShell 脚本，
      # 本仓其它 workflow 只用 bash 是因为它们没有 PowerShell 步骤。
      - name: Build signed release APK and AAB
        shell: pwsh
        env:
          KHY_ANDROID_STORE_FILE: khyos-release.keystore
          KHY_ANDROID_KEY_ALIAS: ${{ secrets.KHY_ANDROID_KEY_ALIAS }}
          KHY_ANDROID_STORE_PASSWORD: ${{ secrets.KHY_ANDROID_STORE_PASSWORD }}
          KHY_ANDROID_KEY_PASSWORD: ${{ secrets.KHY_ANDROID_KEY_PASSWORD }}
        run: ./scripts/release/build-android.ps1

      - name: Verify release signature
        shell: pwsh
        run: |
          if (-not (Test-Path dist/android/app-release.apk)) {
            Write-Host "::warning::no app-release.apk (debug-signed build) - nothing to verify or upload"
            exit 0
          }
          node scripts/release/verify-android-signature.js --apk dist/android/app-release.apk
          if ($LASTEXITCODE -ne 0) { throw "release signature verification failed - refusing to upload" }

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khy-os-android-release
          path: |
            dist/android/app-release.apk
            dist/android/app-release.aab
            dist/android/mapping.txt
            dist/android/SHA256SUMS.txt
          retention-days: 30

  publish-dev-index:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Checkout update index generator
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate and verify dev update index
        shell: bash
        run: |
          mkdir -p publish
          while IFS= read -r -d '' archive; do
            cp "$archive" "publish/$(basename "$archive")"
          done < <(find artifacts -type f -name 'portable-dev-*.zip' -print0)
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/dev-channel"
          node scripts/release/update-index.js \
            --artifacts artifacts \
            --base-url "$BASE_URL" \
            --channel dev \
            --commit "$GITHUB_SHA" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --out publish/update-index-dev.json
          node scripts/release/update-index.js \
            --verify publish/update-index-dev.json \
            --channel dev \
            --commit "$GITHUB_SHA"

      - name: Publish dev channel assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view dev-channel >/dev/null 2>&1; then
            gh release create dev-channel \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "KhyOS development channel" \
              --notes "Automatically updated development-channel artifacts."
          fi
          gh release upload dev-channel publish/* --clobber

  release:
    # build-android 也在 needs 里：dist/android 是发布件的一部分，
    # 少了它这次 release 就不含 Android 签名链。
    needs: [build, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # softprops/action-gh-release needs contents:write to create the release;
    # the default GITHUB_TOKEN is read-only and fails with 403 otherwise.
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata generator
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Build GitHub package artifacts
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel --sdist --outdir artifacts/package
          npm pack works/ship/npm --pack-destination artifacts/package

      - name: Generate and verify update index
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CHANNEL=stable
          if [[ "$VERSION" == *-rc* || "$VERSION" == *-beta* || "$VERSION" == *-alpha* ]]; then
            CHANNEL=preview
          fi
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          PIP_ARTIFACT="$(find artifacts/package -maxdepth 1 -type f -name '*.whl' -print -quit)"
          NPM_ARTIFACT="$(find artifacts/package -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$PIP_ARTIFACT"
          test -n "$NPM_ARTIFACT"
          node scripts/release/update-index.js \
            --artifacts artifacts \
            --base-url "$BASE_URL" \
            --channel "$CHANNEL" \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --pip-artifact "$PIP_ARTIFACT" \
            --npm-artifact "$NPM_ARTIFACT" \
            --out "artifacts/update-index-${CHANNEL}.json"
          node scripts/release/update-index.js \
            --verify "artifacts/update-index-${CHANNEL}.json" \
            --channel "$CHANNEL" \
            --version "$VERSION" \
            --commit "$GITHUB_SHA"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/portable-runtime-*.zip
            artifacts/package/*.whl
            artifacts/package/*.tar.gz
            artifacts/package/*.tgz
            artifacts/update-index-stable.json
            artifacts/update-index-preview.json
            artifacts/khy-os-android-release/app-release.apk
            artifacts/khy-os-android-release/app-release.aab
            artifacts/khy-os-android-release/mapping.txt
            artifacts/khy-os-android-release/SHA256SUMS.txt
          # Android 侧是「有 secret 才上传」：缺 secret 时构建走 debug 回退、
          # 产物叫 app-debug.*，上面四条 glob 一条都匹配不到。设为 false 才不会
          # 让一个可选的 Android 归档把整个 release 拖失败。
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
