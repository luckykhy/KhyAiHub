<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 414" width="680" height="414" role="img">
<title>khy-os 系统提示词的四层分区与落点顺序</title>
<desc>静态段位于 __SYSTEM_PROMPT_DYNAMIC_BOUNDARY__ 之前；边界之后依次是稳定动态组、动态组之后的尾巴，以及死尾处的易变组与按需胶囊。自上而下稳定性递减。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="414" fill="#ffffff"/>

<line x1="58" y1="68" x2="58" y2="384" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="58" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">稳定</text>
<text x="58" y="398" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">易变</text>

<rect x="88" y="40" width="552" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="104" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#0C447C">static · 静态（编译期常量）</text>
<text x="104" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#185FA5">12 段 · 前缀 · 只由源码字面量决定，不读运行时输入</text>

<text x="364" y="104" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#5F5E5A">__SYSTEM_PROMPT_DYNAMIC_BOUNDARY__</text>
<line x1="88" y1="112" x2="640" y2="112" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 4"/>

<rect x="88" y="124" width="552" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="104" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#0C447C">dynamic_stable · 动态·稳定（会话级）</text>
<text x="104" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#185FA5">15 段 · cacheKey 必须折入它读到的每一个运行时输入</text>

<rect x="88" y="194" width="552" height="48" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="104" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#0C447C">trailing · 动态组之后</text>
<text x="104" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#185FA5">2 段 · content_output_guide · base_security</text>

<rect x="88" y="256" width="552" height="68" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="104" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#633806">dynamic_volatile · 动态·易变（每轮或每分钟）</text>
<text x="104" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#854F0B">5 段 · 重排到动态区尾部，使静态前缀不被击穿</text>
<text x="104" y="316" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#854F0B">task_memory · env_info · mcp_instructions · git_status · project_structure</text>

<rect x="88" y="338" width="552" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="104" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#633806">on_demand · 按需胶囊（意图选片）</text>
<text x="104" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#854F0B">17 段 · 绝对尾部 · 按用户每一轮的意图重选内容集合</text>
</svg>
