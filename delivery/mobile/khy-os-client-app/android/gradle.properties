# 本机常时内存紧张（实测可用 ~1.9 GB / 15.8 GB，夸克+ZCode+微信在白名单内常驻）。
# 原来写 -Xmx8G 会让 daemon 一启动就被 OS 回收，报
# "Gradle build daemon disappeared unexpectedly"，构建必败。
# 2G 是实测能跑完 release 构建的上限之内的选择；若后续升级依赖可再评估。
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation (cross-drive issue: project on D:, cache on C:)
kotlin.incremental=false
# AGP 9.1.0 把 defaultConfig.resValue 收进了 buildfeatures.resvalues 这个 feature flag
# 后面，默认关。而 app/build.gradle 的 canary 盖章用了 resValue（
# "resValue \"string\", \"khy_canary\", khyCanary"），所以这个 flag 一关，
# 配置阶段就直接失败。
# 必须写在这里而不是 ~/.gradle/gradle.properties：干净检出（CI / 新克隆 / 别人机器）
# 不带你本机的全局配置，少了这一行构建必败；放在仓库里才随源码一起被签出。
android.defaults.buildfeatures.resvalues=true

# ── 构建速度（2026-11-03）────────────────────────────────────────────────────
# 动机：原生侧（llama.cpp + mtmd + GGML_CPU_ALL_VARIANTS 的 7 个 CPU 后端 +
# quickjs-ng）一次全量重编以分钟计，.cxx 产物 1.4 GB（RelWithDebInfo 997 MB +
# Debug 435 MB）。真正的解法是「别重建」——Dart 改动走 flutter run 热重载，
# 秒级且完全不碰原生；这里的两项只是把「不得不重建」的那些次变便宜。
#
# 构建缓存：跨构建复用任务输出（含原生任务的中间产物）。纯磁盘收益，
# 对本机 ~1.9 GB 可用内存的处境基本无代价，所以先开它。
org.gradle.caching=true
#
# configuration-cache 试过，**不行，已回退**（2026-11-03 实测）。
# ./gradlew help 能过（root 任务，不碰 :app 的 Flutter 任务），但
# assembleDebug 直接失败：273 个 configuration cache 问题，根因是
# com.flutter.gradle.DependencyVersionChecker$configureMinSdkCheck 挂的
# :app:DebugMinSdkCheck 任务序列化不了（KotlinAndroidSourceSetFactory 的
# compilationCompilerOptions、FutureImpl 等）。也就是 **Flutter Gradle 插件
# 自身**还没跟上配置缓存，不是我们的配置能绕开的。等 Flutter 插件修好再试。
#
# 刻意不开 org.gradle.parallel：它会起多 worker 并发执行任务，内存占用随
# worker 数上涨。本文件顶部记录过 -Xmx8G 会让 daemon 被 OS 回收、构建必败，
# 2G 是实测能跑完的上限之内——在这台机器上 parallel 很可能是负优化。
# 若日后内存处境改善（或换机器），优先试它，并对比上面的 caching 收益。
#
# kotlin.incremental 维持 false（见下面那条注释）：本机 Kotlin 只有 18 个
# 文件 / 6.4k 行，全量编译是秒级，开增量的收益远小于它当初被关掉时那个
# 跨盘问题（工程在 D:、缓存在 C:）的风险。要开得先把 kotlin 的持久缓存
# 目录指到 D: 再实测，不能直接翻开关。
