name: khy_os_client
description: "khy-os Client - AI Super Client with Chat, Agent, Floating Window"
publish_to: 'none'
version: 1.1.17+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Database
  # sqflite 是实际在用的那个（lib/core/db/）。drift/sqlite3_flutter_libs 声明了
  # 却从未解析进 lock、也没有任何 import——启用 drift 要跑 build_runner 代码生成，
  # 而当前没有可验证它的环境（手机离线、主机无 sqlite3.dll）。先用 sqflite +
  # 手写 SQL 落地，要迁 drift 时这三行再一起动。
  sqflite: ^2.4.5
  path_provider: ^2.1.5
  path: ^1.9.0
  # meta 只为一个 @immutable 标注；不引入也可以（删标注即可），但留着能让
  # AmooTurn 的不可变性对读代码的人和 lint 都显式。
  meta: ^1.19.0

  # HTTP & WebSocket
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  # Directly imported by lib/core/services/local_model_store.dart for the 2.8 GB
  # model download, which needs `Response.stream` — dio has no equivalent that
  # exposes the raw byte stream with a Range header on a plain GET. It was
  # already in the lock as a transitive dep; declaring it makes the import
  # legitimate rather than accidental.
  http: ^1.2.0

  # Security
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3

  # UI
  flutter_markdown: ^0.7.5
  flutter_highlight: ^0.7.0
  markdown: ^7.2.2

  # Media & File
  cached_network_image: ^3.4.1

  # QR pairing — reads the `khy mobile app` pairing code (Capacitor shell parity).
  # Pinned exactly: `errorBuilder` takes 2 params in 7.x, so a bump must be
  # re-checked against lib/ui/screens/qr_scan_screen.dart.
  mobile_scanner: 7.4.2

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  logger: ^2.5.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true
  # 品牌资产（Khy OS 主标）。由 `node scripts/brand/build-brand-assets.js` 落盘，
  # 几何真源在 delivery/brand/khy-brand-geometry.js —— 不要手改 assets/brand/ 下的 PNG。
  assets:
    - assets/brand/
